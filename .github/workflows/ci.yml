name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modall_test
          POSTGRES_USER: modall
          POSTGRES_PASSWORD: modall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modall -d modall_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MODALL_DATABASE_URL: postgresql://modall:modall@localhost:5432/modall_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: make release-artifacts
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run api:generate
      - run: git diff --exit-code -- apps/web/src/api
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:test
      - run: npm run web:build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @modall/web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
