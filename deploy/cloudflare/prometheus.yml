global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: modall-api
    static_configs:
      - targets: ["172.31.0.11:8000"]
  - job_name: modall-worker
    static_configs:
      - targets: ["172.31.0.12:9101"]
