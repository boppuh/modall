worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location /v1/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_hide_header Server;
        }

        location ~ ^/health/(live|ready)$ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_hide_header Server;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
