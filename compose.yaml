name: modall

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modall
      POSTGRES_USER: modall
      POSTGRES_PASSWORD: modall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modall -d modall"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && exec modall-api"]
    environment:
      MODALL_DATABASE_URL: postgresql://modall:modall@postgres:5432/modall
      MODALL_ENVIRONMENT: local
      MODALL_LOG_LEVEL: ${MODALL_LOG_LEVEL:-INFO}
      MODALL_API_MAX_CONCURRENCY: ${MODALL_API_MAX_CONCURRENCY:-64}
      MODALL_API_QUEUE_TIMEOUT_SECONDS: ${MODALL_API_QUEUE_TIMEOUT_SECONDS:-0.25}
      MODALL_API_RATE_LIMIT_PER_MINUTE: ${MODALL_API_RATE_LIMIT_PER_MINUTE:-600}
      MODALL_MAX_ARGUMENT_BYTES: ${MODALL_MAX_ARGUMENT_BYTES:-65536}
      MODALL_MAX_RESULT_BYTES: ${MODALL_MAX_RESULT_BYTES:-262144}
      MODALL_CONFIRMATION_TTL_SECONDS: ${MODALL_CONFIRMATION_TTL_SECONDS:-120}
      MODALL_MAX_RUN_SECONDS: ${MODALL_MAX_RUN_SECONDS:-300}
      MODALL_ARGUMENT_RETENTION_DAYS: ${MODALL_ARGUMENT_RETENTION_DAYS:-14}
      MODALL_RESULT_RETENTION_DAYS: ${MODALL_RESULT_RETENTION_DAYS:-14}
      MODALL_RUN_RETENTION_DAYS: ${MODALL_RUN_RETENTION_DAYS:-90}
      MODALL_MAX_ACTIVE_RUNS_PER_WORKSPACE: ${MODALL_MAX_ACTIVE_RUNS_PER_WORKSPACE:-100}
      MODALL_RECONCILIATION_BATCH_SIZE: ${MODALL_RECONCILIATION_BATCH_SIZE:-100}
      MODALL_SCHEMA_VALIDATION_TIMEOUT_SECONDS: ${MODALL_SCHEMA_VALIDATION_TIMEOUT_SECONDS:-2}
      MODALL_SCHEMA_VALIDATION_MEMORY_BYTES: ${MODALL_SCHEMA_VALIDATION_MEMORY_BYTES:-268435456}
      MODALL_CORS_ALLOWED_ORIGINS: '${MODALL_CORS_ALLOWED_ORIGINS:-["http://localhost:5173"]}'
      MODALL_CONFIRMATION_HMAC_KEY_VERSIONS: '${MODALL_CONFIRMATION_HMAC_KEY_VERSIONS:-["v1"]}'
      MODALL_IDEMPOTENCY_HMAC_KEY_VERSIONS: '${MODALL_IDEMPOTENCY_HMAC_KEY_VERSIONS:-["v1"]}'
      MODALL_FIXTURE_SECRET_ROOT: /run/modall-fixtures
    volumes:
      - ./.modall/fixture-secrets:/run/modall-fixtures:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 1536m

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["modall-worker"]
    environment:
      MODALL_DATABASE_URL: postgresql://modall:modall@postgres:5432/modall
      MODALL_ENVIRONMENT: local
      MODALL_LOG_LEVEL: ${MODALL_LOG_LEVEL:-INFO}
      MODALL_WORKER_POLL_INTERVAL_SECONDS: ${MODALL_WORKER_POLL_INTERVAL_SECONDS:-1}
      MODALL_WORKER_MAINTENANCE_INTERVAL_SECONDS: ${MODALL_WORKER_MAINTENANCE_INTERVAL_SECONDS:-60}
      MODALL_WORKER_LEASE_DURATION_SECONDS: ${MODALL_WORKER_LEASE_DURATION_SECONDS:-30}
      MODALL_WORKER_METRICS_PORT: ${MODALL_WORKER_METRICS_PORT:-9101}
      MODALL_MAX_ARGUMENT_BYTES: ${MODALL_MAX_ARGUMENT_BYTES:-65536}
      MODALL_MAX_RESULT_BYTES: ${MODALL_MAX_RESULT_BYTES:-262144}
      MODALL_CONFIRMATION_TTL_SECONDS: ${MODALL_CONFIRMATION_TTL_SECONDS:-120}
      MODALL_MAX_RUN_SECONDS: ${MODALL_MAX_RUN_SECONDS:-300}
      MODALL_ARGUMENT_RETENTION_DAYS: ${MODALL_ARGUMENT_RETENTION_DAYS:-14}
      MODALL_RESULT_RETENTION_DAYS: ${MODALL_RESULT_RETENTION_DAYS:-14}
      MODALL_RUN_RETENTION_DAYS: ${MODALL_RUN_RETENTION_DAYS:-90}
      MODALL_MAX_ACTIVE_RUNS_PER_WORKSPACE: ${MODALL_MAX_ACTIVE_RUNS_PER_WORKSPACE:-100}
      MODALL_RECONCILIATION_BATCH_SIZE: ${MODALL_RECONCILIATION_BATCH_SIZE:-100}
      MODALL_SCHEMA_VALIDATION_TIMEOUT_SECONDS: ${MODALL_SCHEMA_VALIDATION_TIMEOUT_SECONDS:-2}
      MODALL_SCHEMA_VALIDATION_MEMORY_BYTES: ${MODALL_SCHEMA_VALIDATION_MEMORY_BYTES:-268435456}
      MODALL_CONFIRMATION_HMAC_KEY_VERSIONS: '${MODALL_CONFIRMATION_HMAC_KEY_VERSIONS:-["v1"]}'
      MODALL_IDEMPOTENCY_HMAC_KEY_VERSIONS: '${MODALL_IDEMPOTENCY_HMAC_KEY_VERSIONS:-["v1"]}'
      MODALL_FIXTURE_SECRET_ROOT: /run/modall-fixtures
    volumes:
      - ./.modall/fixture-secrets:/run/modall-fixtures:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    expose:
      - "${MODALL_WORKER_METRICS_PORT:-9101}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['MODALL_WORKER_METRICS_PORT'] + '/health/live')",
        ]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
