groups:
  - name: modall-registry-alpha
    rules:
      - alert: ModallApiErrorRateHigh
        expr: sum(rate(modall_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(modall_http_requests_total[5m])), 1) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Modall API 5xx rate exceeds 2%" }
      - alert: ModallApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(modall_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Modall API p95 latency exceeds one second" }
      - alert: ModallWorkerInvocationFailures
        expr: increase(modall_worker_invocations_total{outcome=~"failed|indeterminate"}[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "A worker invocation needs diagnosis" }
      - alert: ModallMaintenanceFailure
        expr: increase(modall_worker_maintenance_total{outcome="failed"}[15m]) > 0
        for: 0m
        labels: { severity: page }
        annotations: { summary: "Retention maintenance failed" }
