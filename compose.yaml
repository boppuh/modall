name: modall

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modall
      POSTGRES_USER: modall
      POSTGRES_PASSWORD: modall
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modall -d modall"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["modall-api"]
    environment:
      MODALL_DATABASE_URL: postgresql://modall:modall@postgres:5432/modall
      MODALL_ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["modall-worker"]
    environment:
      MODALL_DATABASE_URL: postgresql://modall:modall@postgres:5432/modall
      MODALL_ENVIRONMENT: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
